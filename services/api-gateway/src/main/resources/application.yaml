spring:
  application:
    name: api-gateway

  config:
    import: optional:file:/home/alamgir/Alamgir/workingProject/MBSTU_DiningPass/services/api-gateway/.env[.properties]

  cloud:
    gateway:
      server:
        webflux:
          enabled: true
          default-filters: []


firebase:
  service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON}


services:
  auth-service:
    url: ${AUTH_SERVICE_URL}
  meal-service:
    url: ${MEAL_SERVICE_URL}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

server:
  port: ${API_GATEWAY_SERVER_PORT}

logging:
  level:
    root: INFO
    com.mbstu.diningpass: INFO
    org.springframework.cloud.gateway: INFO