name: Auth Service - Test
permissions:
  contents: read
  checks: write
on:
  push:
    paths:
      - "services/auth-service/**"
      - ".github/workflows/auth-service-test.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "services/auth-service/**"
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      auth-db:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test
          POSTGRES_DB: auth_service_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: services/auth-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: services/auth-service/pom.xml
      - name: Build and Test with Maven
        run: mvn -B clean verify
        env:
          # --- CI-only infra (ephemeral container, not sensitive) ---
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: auth_service_db
          DB_USER: postgres
          DB_PASSWORD: postgres_test
          AUTH_SERVICE_SERVER_PORT: 8081
          # --- Real secrets ---
          FIREBASE_SERVICE_ACCOUNT_JSON: dummy-not-used-in-current-tests
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-service-test-reports
          path: services/auth-service/target/surefire-reports
      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Auth Service JUnit Tests
          path: services/auth-service/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: true