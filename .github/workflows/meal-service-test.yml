name: Meal Service - Test
permissions:
  contents: read
  checks: write
on:
  push:
    paths:
      - "services/meal-service/**"
      - ".github/workflows/meal-service-test.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "services/meal-service/**"
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      meal-db:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test
          POSTGRES_DB: meal_service_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: services/meal-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: services/meal-service/pom.xml
      - name: Build and Test with Maven
        run: mvn -B clean verify
        env:
          # --- CI-only infra (ephemeral containers, not sensitive) ---
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: meal_service_db
          DB_USER: postgres
          DB_PASSWORD: postgres_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          MEAL_SERVICE_SERVER_PORT: 8082

          # --- Non-sensitive config values (just need something to bind to) ---
          AUTH_SERVICE_URL: http://localhost:8081
          FRONTEND_URL: http://localhost:3000
          BKASH_GRANT_TOKEN_URL: https://bkash.test/grant
          BKASH_REFRESH_TOKEN_URL: https://bkash.test/refresh
          BKASH_CREATE_PAYMENT_URL: https://bkash.test/create
          BKASH_EXECUTE_PAYMENT_URL: https://bkash.test/execute
          BKASH_REFUND_URL: https://bkash.test/refund
          BKASH_CALLBACK_URL: https://bkash.test/callback

          # --- Fake credentials (tests mock RestTemplate/BkashProperties, real values never used) ---
          BKASH_USERNAME: test-username
          BKASH_PASSWORD: test-password
          BKASH_API_KEY: test-api-key
          BKASH_SECRET_KEY: test-secret-key

          JWT_SECRET: ci-test-only-jwt-secret-not-used-in-current-test-suite-32bytes-min
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meal-service-test-reports
          path: services/meal-service/target/surefire-reports
      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Meal Service JUnit Tests
          path: services/meal-service/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: true