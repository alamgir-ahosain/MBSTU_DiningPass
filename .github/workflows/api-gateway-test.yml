name: API Gateway - Test

permissions:
  contents: read
  checks: write

on:
  push:
    paths:
      - "services/api-gateway/**"
      - ".github/workflows/api-gateway-test.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "services/api-gateway/**"

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/api-gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: services/api-gateway/pom.xml

      - name: Build and Test with Maven
        run: mvn -B clean verify
        env:
          AUTH_SERVICE_URL: ${{ secrets.AUTH_SERVICE_URL }}
          MEAL_SERVICE_URL: ${{ secrets.MEAL_SERVICE_URL }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          API_GATEWAY_SERVER_PORT: 8080
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-gateway-test-reports
          path: services/api-gateway/target/surefire-reports

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: API Gateway JUnit Tests
          path: services/api-gateway/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: true